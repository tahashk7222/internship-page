<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Applications | Inquisitor</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* =====================================================
           APPLICATIONS PAGE
        ===================================================== */

        .applications-page {

            padding: 30px;

        }


        /* =====================================================
           PAGE HEADER
        ===================================================== */

        .page-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 30px;

            gap: 20px;

        }


        .page-header h1 {

            margin: 0;

            font-size: 30px;

            color: #172033;

        }


        .page-header p {

            margin-top: 8px;

            color: #777;

        }


        .breadcrumb {

            margin-bottom: 8px;

            color: #6b7280;

            font-size: 14px;

        }


        /* =====================================================
           APPLICATION COUNT
        ===================================================== */

        .applications-count {

            background: #eef2ff;

            color: #4f46e5;

            padding: 10px 16px;

            border-radius: 20px;

            font-weight: 600;

            white-space: nowrap;

        }


        /* =====================================================
           APPLICATION CARD
        ===================================================== */

        .application-card {

            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 12px;

            padding: 24px;

            margin-bottom: 18px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.05);

        }


        .application-top {

            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 20px;

        }


        .applicant-info h2 {

            margin: 0;

            font-size: 21px;

            color: #172033;

        }


        .applicant-email {

            margin-top: 7px;

            color: #777;

        }


        /* =====================================================
           STATUS
        ===================================================== */

        .application-status {

            padding: 6px 13px;

            border-radius: 20px;

            font-size: 13px;

            font-weight: 600;

            background: #fef3c7;

            color: #92400e;

            white-space: nowrap;

        }


        .application-status.selected {

            background: #dcfce7;

            color: #166534;

        }


        .application-status.rejected {

            background: #fee2e2;

            color: #991b1b;

        }


        /* =====================================================
           APPLICATION DETAILS
        ===================================================== */

        .application-details {

            display: flex;

            gap: 40px;

            margin-top: 20px;

            color: #555;

            flex-wrap: wrap;

        }


        .application-details strong {

            color: #333;

        }


        /* =====================================================
           FEEDBACK
        ===================================================== */

        .feedback-section {

            margin-top: 22px;

        }


        .feedback-section label {

            display: block;

            margin-bottom: 8px;

            font-weight: 600;

            color: #333;

        }


        .feedback-section textarea {

            width: 100%;

            min-height: 90px;

            padding: 12px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            resize: vertical;

            box-sizing: border-box;

            font-family: inherit;

            font-size: 14px;

        }


        .feedback-section textarea:focus {

            outline: none;

            border-color: #4f46e5;

        }


        /* =====================================================
           BUTTONS
        ===================================================== */

        .application-actions {

            display: flex;

            gap: 10px;

            margin-top: 15px;

            flex-wrap: wrap;

        }


        .application-btn {

            padding: 9px 18px;

            border-radius: 7px;

            cursor: pointer;

            font-size: 14px;

            border: 1px solid #ddd;

            background: white;

        }


        .application-btn:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        .select-btn {

            color: #166534;

            border-color: #86efac;

        }


        .select-btn:hover {

            background: #dcfce7;

        }


        .reject-btn {

            color: #dc2626;

            border-color: #fca5a5;

        }


        .reject-btn:hover {

            background: #fee2e2;

        }


        .feedback-btn {

            background: #4f46e5;

            color: white;

            border: none;

        }


        .feedback-btn:hover {

            background: #4338ca;

        }


        /* =====================================================
           SIDEBAR
           SAME ORDER AS INTERNSHIPS / EVENTS PAGE
        ===================================================== */

        .navigation {

            display: flex;

            flex-direction: column;

            gap: 8px;

            margin-top: 30px;

        }


        .navigation .nav-item {

            display: flex;

            align-items: center;

            gap: 14px;

            padding: 14px 20px;

            color: #e5e7eb;

            text-decoration: none;

            border-radius: 12px;

            font-size: 17px;

            transition: 0.2s;

        }


        .navigation .nav-item span {

            width: 25px;

            min-width: 25px;

            text-align: center;

        }


        .navigation .nav-item:hover {

            background: #1e293b;

            color: white;

        }


        .navigation .nav-item.active {

            background: #4f46e5;

            color: white;

        }


        .sidebar-bottom .nav-item {

            display: flex;

            align-items: center;

            gap: 14px;

            padding: 12px 20px;

            color: #e5e7eb;

            text-decoration: none;

            border-radius: 10px;

        }


        .sidebar-bottom .nav-item:hover {

            background: #1e293b;

            color: white;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 800px) {

            .page-header {

                flex-direction: column;

                align-items: flex-start;

            }


            .applications-page {

                padding: 20px;

            }


            .application-top {

                flex-direction: column;

                align-items: flex-start;

            }


            .application-details {

                flex-direction: column;

                gap: 10px;

            }

        }


        @media (max-width: 600px) {

            .application-card {

                padding: 18px;

            }


            .application-actions {

                flex-direction: column;

            }


            .application-btn {

                width: 100%;

            }

        }

    </style>

</head>


<body>


<div class="page">

        <!-- =================================================

        <nav class="navigation">


            <!-- DASHBOARD -->

            <a

            <!-- COMMUNITY -->

            <a

        <!-- =================================================

    <!-- =====================================================
         MAIN CONTENT
    ===================================================== -->

    <main class="main-content">


        <div class="applications-page">


            <!-- =================================================
                 HEADER
            ================================================= -->

            <div class="page-header">


                <div>

                    <p class="breadcrumb">
                        Teacher / Applications
                    </p>


                    <h1>
                        Internship Applications
                    </h1>


                    <p>
                        Review and manage students who applied
                        for internships.
                    </p>

                </div>


                <div
                    class="applications-count"
                    id="applicationsCount"
                >
                    3 Applications
                </div>


            </div>



                        <!-- APPLICATIONS LOADED FROM BACKEND -->
            <div id="applicationsList">
                <p style="color:#777;">Loading applications...</p>
            </div>


    </main>

<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>
const API_BASE = "http://localhost:5000/api";
const INTERNSHIP_ID = "6a7f21b5e8d727c35b8b9be0";

async function loadApplications() {
    const list = document.getElementById("applicationsList");
    const count = document.getElementById("applicationsCount");
    try {
        const response = await fetch(`${API_BASE}/applications/internship/${INTERNSHIP_ID}`);
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.message || "Failed to fetch applications");
        count.textContent = `${data.count} Application${data.count === 1 ? "" : "s"}`;
        if (!data.applications.length) { list.innerHTML = "<p style='color:#777;'>No applications found.</p>"; return; }
        list.innerHTML = data.applications.map((app, index) => {
            const status = app.status || "Applied";
            const cls = status === "Selected" ? "selected" : status === "Rejected" ? "rejected" : "";
            const date = app.createdAt ? new Date(app.createdAt).toLocaleDateString("en-US", {year:"numeric",month:"long",day:"numeric"}) : "N/A";
            const name = app.userName || `Applicant ${index + 1}`;
            const email = app.userEmail || app.userId || "User ID unavailable";
            return `
            <div class="application-card">
                <div class="application-top">
                    <div class="applicant-info"><h2>${escapeHtml(name)}</h2><div class="applicant-email">${escapeHtml(email)}</div></div>
                    <span class="application-status ${cls}" id="status-${app._id}">${escapeHtml(status)}</span>
                </div>
                <div class="application-details"><div><strong>Internship:</strong> Software Engineering Intern</div><div><strong>Applied:</strong> ${escapeHtml(date)}</div></div>
                <div class="feedback-section"><label for="feedback-${app._id}">Feedback</label><textarea id="feedback-${app._id}" placeholder="Write feedback for the applicant...">${escapeHtml(app.feedback || "")}</textarea></div>
                <div class="application-actions">
                    <button type="button" class="application-btn select-btn" onclick="evaluateApplication('${app._id}','Selected')">✓ Select</button>
                    <button type="button" class="application-btn reject-btn" onclick="evaluateApplication('${app._id}','Rejected')">✕ Reject</button>
                    <button type="button" class="application-btn feedback-btn" onclick="sendFeedback('${app._id}')">Send Feedback</button>
                </div>
            </div>`;
        }).join("");
    } catch (error) {
        console.error("Load applications error:", error);
        list.innerHTML = "<p style='color:#dc2626;'>Could not connect to the backend.</p>";
    }
}

async function evaluateApplication(id, status) {
    const feedback = document.getElementById(`feedback-${id}`).value.trim();
    try {
        const response = await fetch(`${API_BASE}/applications/${id}/evaluate`, {method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify({status, feedback})});
        const data = await response.json();
        if (!response.ok || !data.success) { alert(data.message || "Could not update application."); return; }
        const el = document.getElementById(`status-${id}`); el.textContent = status; el.classList.remove("selected","rejected"); if(status === "Selected") el.classList.add("selected"); if(status === "Rejected") el.classList.add("rejected");
        alert("Application status updated successfully.");
    } catch(error) { console.error(error); alert("Could not connect to the backend."); }
}

async function sendFeedback(id) {
    const feedbackElement = document.getElementById(`feedback-${id}`);
    const feedback = feedbackElement.value.trim();
    if (!feedback) { alert("Please write feedback first."); return; }
    try {
        const response = await fetch(`${API_BASE}/applications/${id}/evaluate`, {method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify({status:"Reviewed", feedback})});
        const data = await response.json();
        if (!response.ok || !data.success) { alert(data.message || "Could not upload feedback."); return; }
        const el = document.getElementById(`status-${id}`); el.textContent = "Reviewed"; el.classList.remove("selected","rejected");
        alert("Feedback uploaded successfully!");
    } catch(error) { console.error(error); alert("Could not connect to the backend."); }
}

function escapeHtml(value) { return String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;"); }
loadApplications();
</script>
